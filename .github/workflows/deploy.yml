name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Gunakan versi LTS agar stabil

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run prod # Menjalankan minifikasi HTML, CSS, dan JS

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Folder yang akan di-upload ke GitHub Pages
          branch: gh-pages # Branch tujuan untuk hosting
